<svg width="960" height="640" viewBox="0 0 960 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">3D contribution graph placeholder</title>
  <desc id="desc">The 3D contribution graph workflow replaces this placeholder with the generated graph.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="960" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5FF"/>
      <stop offset="0.5" stop-color="#FF2BD6"/>
      <stop offset="1" stop-color="#FCEE0A"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCEE0A"/>
      <stop offset="0.48" stop-color="#FF2BD6"/>
      <stop offset="1" stop-color="#00F5FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="640" rx="8" fill="#0D1117"/>
  <rect x="4" y="4" width="952" height="632" rx="7" stroke="url(#border)" stroke-width="3" filter="url(#glow)"/>
  <g opacity="0.85">
    <path d="M230 430L480 300L730 430L480 560L230 430Z" stroke="#00F5FF" stroke-opacity="0.45"/>
    <path d="M230 430L480 300L730 430" stroke="#FF2BD6" stroke-opacity="0.35"/>
    <path d="M480 300V560" stroke="#FCEE0A" stroke-opacity="0.35"/>
    <rect x="360" y="378" width="34" height="90" fill="url(#bar)" opacity="0.76"/>
    <rect x="420" y="336" width="34" height="132" fill="url(#bar)" opacity="0.9"/>
    <rect x="480" y="392" width="34" height="76" fill="url(#bar)" opacity="0.7"/>
    <rect x="540" y="312" width="34" height="156" fill="url(#bar)" opacity="1"/>
  </g>
  <text x="480" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#E6EDF3">3D Contribution Graph Booting</text>
  <text x="480" y="218" text-anchor="middle" font-family="Consolas, Cascadia Code, monospace" font-size="18" fill="#9BEFFD">The GitHub-Profile-3D-Contrib workflow replaces this file.</text>
  <text x="480" y="256" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#8B949E">Run the workflow once after pushing to generate the live graph.</text>
</svg>
