name: Refresh profile widgets

on:
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update README live widgets
        env:
          SPOTIFY_UID: ${{ vars.SPOTIFY_UID }}
          WAKATIME_USERNAME: ${{ vars.WAKATIME_USERNAME }}
          DISCORD_USER_ID: ${{ vars.DISCORD_USER_ID }}
          LEETCODE_USERNAME: ${{ vars.LEETCODE_USERNAME }}
          BLOG_FEED_URLS: ${{ vars.BLOG_FEED_URLS }}
        run: node scripts/update-readme-widgets.js

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: refresh profile widgets"
          git push origin HEAD:main
