<svg width="620" height="190" viewBox="0 0 620 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Discord presence setup placeholder</title>
  <desc id="desc">Set DISCORD_USER_ID as a GitHub repository variable to render Discord presence.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="620" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5865F2"/>
      <stop offset="0.55" stop-color="#00F5FF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="620" height="190" rx="8" fill="#0D1117"/>
  <rect x="2" y="2" width="616" height="186" rx="7" stroke="url(#border)" stroke-width="3" filter="url(#glow)"/>
  <rect x="55" y="63" width="76" height="64" rx="22" fill="#5865F2" fill-opacity="0.18" stroke="#5865F2" stroke-width="2"/>
  <circle cx="78" cy="95" r="6" fill="#5865F2"/>
  <circle cx="108" cy="95" r="6" fill="#5865F2"/>
  <path d="M75 119C86 126 101 126 112 119" stroke="#5865F2" stroke-width="5" stroke-linecap="round"/>
  <text x="165" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#E6EDF3">Discord Presence</text>
  <text x="165" y="112" font-family="Consolas, Cascadia Code, monospace" font-size="17" fill="#9BEFFD">Waiting for repository variable: DISCORD_USER_ID</text>
  <text x="165" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8B949E">Enable Lanyard, then rerun the widget workflow.</text>
</svg>
