<svg width="620" height="190" viewBox="0 0 620 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Spotify widget setup placeholder</title>
  <desc id="desc">Set SPOTIFY_UID as a GitHub repository variable to render the live Spotify widget.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="620" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5FF"/>
      <stop offset="0.55" stop-color="#FF2BD6"/>
      <stop offset="1" stop-color="#1DB954"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="620" height="190" rx="8" fill="#0D1117"/>
  <rect x="2" y="2" width="616" height="186" rx="7" stroke="url(#border)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="92" cy="95" r="42" fill="#1DB954" fill-opacity="0.18" stroke="#1DB954" stroke-width="2"/>
  <path d="M68 82C83 76 104 78 119 86M72 96C86 91 102 92 114 99M77 109C88 106 99 107 108 113" stroke="#1DB954" stroke-width="5" stroke-linecap="round"/>
  <text x="165" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#E6EDF3">Spotify Widget</text>
  <text x="165" y="112" font-family="Consolas, Cascadia Code, monospace" font-size="17" fill="#9BEFFD">Waiting for repository variable: SPOTIFY_UID</text>
  <text x="165" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8B949E">Run the Refresh profile widgets workflow after setting it.</text>
</svg>
