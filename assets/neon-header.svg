<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Habiboullah Afouk cyberpunk AI profile banner</title>
  <desc id="desc">A neon cyberpunk profile banner with AI circuitry and grid lines.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070A13"/>
      <stop offset="0.48" stop-color="#10172A"/>
      <stop offset="1" stop-color="#18051F"/>
    </linearGradient>
    <linearGradient id="neon" x1="132" y1="68" x2="1066" y2="276" gradientUnits="userSpaceOnUse">
